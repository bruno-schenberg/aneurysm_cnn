[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-engine"
version = "0.1.0"
description = "Training, evaluation, and analysis pipeline for aneurysm classification experiments"
requires-python = ">=3.10"
dependencies = [
    "dlorchestra @ git+https://github.com/bruno-schenberg/dlorchestra.git@v0.3.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "monai>=1.3",
    "huggingface_hub",  # MONAI downloads the MedicalNet weights (R3D10/18/50) from the HF hub
    "nibabel>=5.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "einops>=0.7"]  # einops: tests cover SWIN_ENC
# PlainConvUNet encoder (src/models.py) — only needed for that architecture.
nnunet = ["dynamic-network-architectures"]
# SwinUNETR encoder (src/models.py) — MONAI's SwinTransformer requires einops at import time.
swin = ["einops>=0.7"]

[tool.setuptools]
py-modules = ["config", "train_models"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "analysis*"]
