[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engine"
version = "0.1.0"
description = "DICOM -> NIfTI preprocessing pipeline for aneurysm MRA data"
requires-python = ">=3.10"
dependencies = [
    "medprep @ git+https://github.com/bruno-schenberg/medprep.git",
    "pydicom>=2.4",
    "pandas>=2.0",
    "monai>=1.3",
    "nibabel>=5.0",
    "numpy>=1.26",
    "itk>=5.3",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "SimpleITK>=2.3",  # N4 bias-field correction (generate_mip_grid --n4)
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# GPU-accelerated Frangi vesselness (steps/step_mip/generate_frangi_mips.py).
# Not pip-installable in a portable way — install via RAPIDS/conda-forge to
# match the cluster's CUDA toolkit version.
gpu = ["cupy", "cucim"]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["steps*"]
